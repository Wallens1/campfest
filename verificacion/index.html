<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://campfest-api-production.up.railway.app https://*.up.railway.app https://api.campfest.online https://lazarmjxajhdjvuhtzcl.supabase.co wss://lazarmjxajhdjvuhtzcl.supabase.co; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificación de carta · Camp Fest</title>
<meta name="theme-color" content="#FFF7EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../paneles/base.css?v=2">
<style>
.contenedor{ max-width:520px; margin:0 auto; padding:56px 16px 80px; }
.encabezado{ margin-bottom:24px; }
.encabezado .marca-login{ margin-bottom:20px; }
.encabezado h1{ font-size:28px; font-weight:800; margin:0 0 6px; }
.encabezado p{ font-size:15px; color:var(--tinta-3); margin:0; }
.tarjeta{ padding:24px; }
.campo-busqueda{ display:flex; gap:10px; }
.campo-busqueda input{
    flex:1; min-width:0; min-height:50px; padding:10px 14px;
    font-size:17px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    font-variant-numeric:tabular-nums;
    border:2px solid var(--tinta); border-radius:10px; background:var(--blanco);
}
.campo-busqueda input::placeholder{ letter-spacing:.04em; font-weight:500; }
.campo-busqueda input:focus{ outline:none; box-shadow:0 0 0 3px rgba(255,212,0,.65); }
.campo-busqueda .boton{ min-height:50px; }
.ayuda{ margin:10px 0 0; font-size:13px; color:var(--tinta-3); }
.cargando-texto{ display:none; align-items:center; gap:8px; margin-top:16px; font-size:14px; font-weight:600; color:var(--tinta-2); }
.cargando-texto.mostrar{ display:flex; }
.cargando-texto .cf-i{ animation:girar 1s linear infinite; }
@keyframes girar{ to{ transform:rotate(360deg); } }
.resultado{ display:none; margin-top:20px; }
.resultado.mostrar{ display:block; animation:aparecer .22s var(--salida); }
@keyframes aparecer{ from{ opacity:0; transform:translateY(4px); } }
.caja{ border-radius:var(--radio); padding:18px; border:2px solid; }
.resultado.valido .caja{ background:var(--ok-fondo); border-color:var(--ok-texto); }
.resultado.invalido .caja{ background:var(--error-fondo); border-color:var(--error-texto); }
.estado-texto{ display:flex; align-items:center; gap:8px; font-size:16px; font-weight:800; margin-bottom:12px; }
.estado-texto .cf-i{ width:22px; height:22px; }
.resultado.valido .estado-texto{ color:var(--ok-texto); }
.resultado.invalido .estado-texto{ color:var(--error-texto); }
.icono-valido, .icono-invalido{ display:none; }
.resultado.valido .icono-valido, .resultado.invalido .icono-invalido{ display:inline; }
.dato{ margin-bottom:10px; }
.dato:last-child{ margin-bottom:0; }
.dato .valor{ font-size:18px; font-weight:700; }
.pie{ margin-top:24px; font-size:12.5px; color:var(--tinta-3); text-align:center; }
.pie a{ font-weight:600; }
@media (max-width:420px){
    .contenedor{ padding-top:32px; }
    .encabezado h1{ font-size:24px; }
    .campo-busqueda{ flex-direction:column; }
}
</style>
<script src="../config.js"></script>
</head>
<body>

<main class="contenedor">

    <div class="encabezado">
        <a class="marca-login" href="/" style="color:inherit; text-decoration:none;"><span class="sello"><svg class="cf-i" aria-hidden="true"><use href="../campfest/assets/icons.svg?v=2#i-tent"/></svg></span>Camp Fest</a>
        <h1>Verificación de carta</h1>
        <p>Comprueba que una carta de Camp Fest es auténtica con el código impreso en ella.</p>
    </div>

    <div class="tarjeta">

        <label class="campo" for="inputCodigo" style="display:block; margin-bottom:8px; font-size:12.5px; font-weight:600; color:var(--tinta-2);">Código de verificación</label>
        <div class="campo-busqueda">
            <input type="text" id="inputCodigo" placeholder="Ej. ABC123XYZ" autocomplete="off" autocapitalize="characters" spellcheck="false">
            <button type="button" class="boton" id="botonVerificar"><svg class="cf-i" aria-hidden="true"><use href="../campfest/assets/icons.svg?v=2#i-check-circle"/></svg>Verificar</button>
        </div>
        <p class="ayuda">Si escaneaste el QR de la carta, el código ya viene escrito.</p>

        <div class="cargando-texto" id="cargando" role="status"><svg class="cf-i" aria-hidden="true"><use href="../campfest/assets/icons.svg?v=2#i-refresh"/></svg>Consultando…</div>

        <div class="resultado" id="resultado" aria-live="polite">
            <div class="caja">
                <div class="estado-texto"><span class="icono-valido"><svg class="cf-i" aria-hidden="true"><use href="../campfest/assets/icons.svg?v=2#i-check-circle"/></svg></span><span class="icono-invalido"><svg class="cf-i" aria-hidden="true"><use href="../campfest/assets/icons.svg?v=2#i-x-circle"/></svg></span><span id="estadoTexto"></span></div>
                <div id="datosParticipante"></div>
            </div>
        </div>

    </div>

    <p class="pie">¿Dudas sobre una carta? Escribe a la organización desde <a href="/">campfest.online</a>.</p>

</main>

<script>

// La dirección del backend se define en /config.js
const API_BASE = window.CAMPFEST_API;

const input = document.getElementById("inputCodigo");
const boton = document.getElementById("botonVerificar");
const cargando = document.getElementById("cargando");
const resultado = document.getElementById("resultado");
const estadoTexto = document.getElementById("estadoTexto");
const datosParticipante = document.getElementById("datosParticipante");

async function verificar(codigo){

    resultado.className = "resultado";
    cargando.classList.add("mostrar");
    boton.disabled = true;

    try{

        const respuesta = await fetch(
            `${API_BASE}/api/cartas/verificar/${encodeURIComponent(codigo)}`
        );

        const cuerpo = await respuesta.json();

        if (respuesta.ok && cuerpo.ok){

            estadoTexto.textContent = "Documento válido";
            datosParticipante.innerHTML = `
                <div class="dato">
                    <span class="etiqueta">Nombre</span>
                    <span class="valor">${escaparHtml(cuerpo.nombre)}</span>
                </div>
                <div class="dato">
                    <span class="etiqueta">Documento</span>
                    <span class="valor">${escaparHtml(cuerpo.documento)}</span>
                </div>
            `;
            resultado.className = "resultado mostrar valido";

        } else {

            estadoTexto.textContent = "No encontrado";
            datosParticipante.innerHTML = `<p style="margin:0;">${escaparHtml(cuerpo.mensaje || "No se encontró ninguna carta con ese código.")}</p>`;
            resultado.className = "resultado mostrar invalido";

        }

    }catch(error){

        estadoTexto.textContent = "Error";
        datosParticipante.innerHTML = `<p style="margin:0;">No se pudo consultar la verificación. Intenta de nuevo.</p>`;
        resultado.className = "resultado mostrar invalido";

    }finally{

        cargando.classList.remove("mostrar");
        boton.disabled = false;

    }

}

function escaparHtml(texto){
    const div = document.createElement("div");
    div.textContent = texto;
    return div.innerHTML;
}

boton.addEventListener("click", () => {
    const codigo = input.value.trim();
    if (codigo) verificar(codigo);
});

input.addEventListener("keydown", (evento) => {
    if (evento.key === "Enter"){
        const codigo = input.value.trim();
        if (codigo) verificar(codigo);
    }
});

// Si llegan con ?codigo=XXXX en la URL (por ejemplo desde el QR), verificar automáticamente
const parametros = new URLSearchParams(window.location.search);
const codigoUrl = parametros.get("codigo");
if (codigoUrl){
    input.value = codigoUrl;
    verificar(codigoUrl);
}

</script>

</body>
</html>
